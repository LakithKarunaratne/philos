name: Create/Delete Neon Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  create_neon_branch:
    name: Create Neon Branch
    outputs:
      db_url: ${{ steps.create_neon_branch.outputs.db_url }}
      db_url_pooled: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
      branch_name: preview/pr-${{ github.event.number }}
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # PR number only: stable across head-branch renames, and no
          # contributor-controlled branch name is interpolated by the action's
          # shell commands (NEON_API_KEY is exposed in this step)
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

  run_migrations:
    name: Run Migrations (Pinned Prisma CLI)
    needs: create_neon_branch
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR code (for migration files & schema)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts
      - name: Run Migrations with Pinned Prisma CLI
        # Uses pinned Prisma version to avoid package.json script execution.
        # DB URLs passed via env vars bypass prisma.config.ts.
        # Only the migration files from the PR are applied.
        run: npx prisma@7.9.1 migrate deploy
        env:
          # Prisma Migrate requires a direct (unpooled) connection
          DATABASE_URL: ${{ needs.create_neon_branch.outputs.db_url }}
          # pooled connection for any runtime code (available if needed)
          DATABASE_URL_POOLED: ${{ needs.create_neon_branch.outputs.db_url_pooled }}

  delete_neon_branch:
    name: Delete Neon Branch
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # must match the create job's branch_name (PR number only, so cleanup
          # still targets the right branch even if the head branch is renamed)
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}